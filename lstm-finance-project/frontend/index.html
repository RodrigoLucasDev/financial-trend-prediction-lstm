<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Análise de Ações - PUC MINAS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    padding:40px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    text-align:center;
    color:white;
    margin-bottom:40px;
}

.header h1{
    font-size:42px;
    margin-bottom:10px;
}

.header p{
    color:#cbd5e1;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#result{
    margin-top:35px;
}

.result-card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 30px rgba(0,0,0,.15);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:25px;
}

.stat{
    background:#f8fafc;
    padding:20px;
    border-radius:15px;
}

.stat-title{
    color:#64748b;
    font-size:14px;
}

.stat-value{
    font-size:28px;
    font-weight:700;
    margin-top:8px;
}

.buy{
    color:#16a34a;
}

.sell{
    color:#dc2626;
}

.hold{
    color:#d97706;
}

.chart{
    margin-top:30px;
}

.chart img{
    width:100%;
    border-radius:15px;
    border:1px solid #e5e7eb;
}

.explanation{
    margin-top:20px;
    line-height:1.7;
    color:#475569;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>📈 Análise de Ações - PUC Minas</h1>
        <p>Análise financeira utilizando Rede Neural LSTM</p>
    </div>

    <div class="card">

        <div class="form-grid">

            <div>
                <label>Ativo</label>
                <input id="stock" value="PETR4.SA">
            </div>

            <div>
                <label>Data Inicial</label>
                <input type="date" id="startDate">
            </div>

            <div>
                <label>Data Final</label>
                <input type="date" id="endDate">
            </div>

        </div>

        <button onclick="analyze()">
            Analisar Ativo
        </button>

    </div>

    <div id="result"></div>

</div>

<script src="app.js"></script>

</body>
</html>
